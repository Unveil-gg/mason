# Pack bible for Harvest Hollow. Project-wide style (not example-only):
# any asset with `style: harvest` loads this file. Palette is the
# measured AI-hero keys mapped onto the default names so type, icons,
# and 3D cardboard stay on the same colors as the lid illustration.
name: harvest
version: 1

units: meters

palette:
  wood_dark: "#6A400E"
  wood_light: "#A77C54"
  cream: "#DDD0B4"
  accent: "#DC6F4E"
  primary: "#6A400E"
  ink: "#1A1410"
  label_green: "#2E7D4F"
  charcoal: "#3D260B"
  smoke: "#5C5548"
  hydrant_red: "#C23B2E"
  brass: "#EA8540"
  steel: "#8A9196"

geometry:
  bevel_width: 0.003
  bevel_segments: 2

materials:
  roughness: 0.8
  metallic: 0.0
  families:
    painted_metal:
      roughness: 0.45
      metallic: 0.15
      variation: 0.08
    bare_metal:
      roughness: 0.35
      metallic: 0.75
      variation: 0.04
    varnished_wood:
      roughness: 0.35
      metallic: 0.0
      variation: 0.06
    rubber:
      roughness: 0.9
      metallic: 0.0
      variation: 0.02
    plastic:
      roughness: 0.4
      metallic: 0.0
      variation: 0.03
    cardboard:
      roughness: 0.88
      metallic: 0.0
      variation: 0.12
      noise_scale: 6.0

render:
  resolution:
    width: 512
    height: 512
  samples: 16
  engine: eevee

lighting:
  preset: neutral_studio

quality:
  background_prop:
    detail_density: low
  standard_prop:
    detail_density: medium
  focal_prop:
    detail_density: high
  hero:
    detail_density: high
