metadata:
  spin_axis: local_z
  ride_socket: attach_rider
  lift_socket: attach_lift
  lift_axis: local_z
  lift_travel: "0.12"
art_direction:
  subject: >-
    Stand-on electric pallet jack for Scrap Paws.
    Red power unit, black deck, steel forks.
  silhouette: >-
    Low deck in front, tall red cowl, tiller rising
    over the operator, two long forks behind a cage.
  focal_point: red power unit and tiller head
  usage:
    importance: focal_prop
    viewing_distance: medium
  forms:
    primary: [hood, platform, carriage, fork_r]
    secondary: [tiller, backrest, drive_wheel]
    tertiary: [button, badge, grip]
  materials:
    - {family: painted_metal, palette: hydrant_red}
    - {family: plastic, palette: ink}
    - {family: bare_metal, palette: steel}
    - {family: rubber, palette: ink}
  gameplay:
    camera: third person, slightly above
    on_screen_size: vehicle, about a third of the frame
    must_read:
      - pallet jack
      - stand-on deck
      - forks
      - spinning wheels
  constraints:
    - wheels stay separate meshes
    - carriage lifts on attach_lift, local Z, 0.12 m
    - no brand wordmark
    - meters, power unit centered on the origin
  recognition_details:
    - red cowl
    - black operator deck
    - twin forks
    - load backrest
construction_plan:
  techniques:
    - {kind: box, purpose: cowl deck forks cage, applies_to: body}
    - {kind: box, purpose: leaned tiller cylinder, applies_to: tiller}
  primary_forms:
    - {type: box, purpose: power unit and deck}
    - {type: box, purpose: fork pair}
  secondary_forms:
    - {type: cylinder, purpose: drive and load wheels}
    - {type: cylinder, purpose: tiller arm}
  keep_parts: [carriage, drive_wheel, load_wheel_l, load_wheel_r]
geometric_plan:
  recognition: mixed
  stage: material
  symmetry: bilateral
  primary_read: red jack, black deck, long forks
  silhouette: deck, cowl, tiller, fork pair, cage
  proportions: forks longer than the power unit
  must_survive_small: [forks, red cowl, tiller, deck]
  masses:
    - {name: hood, role: primary, connects_to: [cabinet, tiller]}
    - {name: platform, role: primary, connects_to: [cabinet]}
    - {name: carriage, role: primary, connects_to: [fork_apron]}
    - {name: drive_wheel, role: secondary, connects_to: [cabinet]}
    - {name: backrest, role: secondary, connects_to: [fork_apron]}
  landmarks:
    - {id: deck, role: ride, part: platform}
    - {id: tiller_head, role: steer, part: head}
    - {id: drive_hub, role: spin, part: drive_wheel}
    - {id: fork_tip, role: load, part: carriage}
  critical_views:
    - {view: three_quarter, weight: 2}
    - {view: side, weight: 1.5}
    - {view: front, weight: 1}
