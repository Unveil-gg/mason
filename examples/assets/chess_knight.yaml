art_direction:
  subject: Staunton-style chess knight, carved horse head
  style:
    realism: 0.35
    stylization: 0.65
    shape_language: [carved, stacked, equine]
  usage:
    importance: hero
    viewing_distance: close
  focal_point: side-profile horse head on a turned base
  gameplay:
    camera: side
    must_read: [stacked base, S-curve neck, short snout]
  silhouette: stacked base, S-curve neck, short horizontal head, mane down the nape
  forms:
    primary: [socle, column, neck, skull]
    secondary: [jaw, snout, mane, ears]
    tertiary: [eyes, nostrils]
  materials: []
  detail_density: high
  references:
  - path: examples/ref/staunton_knight_side.png
    purpose: silhouette
    view: side
  - path: examples/ref/staunton_knight.jpg
    purpose: color
geometric_plan:
  primary_read: sculptural side profile, not a literal horse
  recognition: silhouette
  must_survive_small:
  - stacked weighted base
  - leaning neck
  - distinct skull vs jaw vs snout
  - mane slab and two ears
  masses:
  - {name: socle, role: primary, notes: stacked foot}
  - {name: neck, role: primary, connects_to: [column, skull]}
  - {name: skull, role: primary, connects_to: [neck, jaw]}
  - {name: jaw, role: primary, connects_to: [skull, snout]}
  - {name: snout, role: secondary, connects_to: [jaw]}
  - {name: mane_crest, role: secondary, connects_to: [skull]}
  silhouette: >
    Side view is the identity view. Named blocks must stay
    readable: skull ball, jaw shelf, snout taper, mane slab.
    Do not remesh them into one mass.
  silhouette_vs_similar: Not a snowman. Not a long tube on a stick.
  proportions: Base about 1/5 height. Snout shorter than the skull.
  symmetry: bilateral
  negative_space: C-notch under the jaw; gap behind the ears
  abstraction: carved blockout, then local polish
  stage: secondary
  landmarks:
  - {id: skull, role: skull, part: skull}
  - {id: jaw, role: lower jaw, part: jaw}
  - {id: snout, role: muzzle, part: snout}
  - {id: neck, role: leaning neck, part: neck}
  - {id: mane, role: mane crest, part: mane_crest}
  - {id: ear, role: left ear, part: ear}
  critical_views:
  - {view: silhouette_side, weight: 3}
  - {view: side, weight: 2}
  - {view: three_quarter, weight: 1}
  notes:
  - Face -Y. Keep these parts named; move one landmark per edit.
  - Remesh or inflate only after the side profile holds.
  - Polish is bevel and extra local parts (cheek, jaw muscle).
construction_plan:
  techniques:
  - {kind: box, purpose: named skull jaw snout mane, applies_to: bust}
  - {kind: remesh, purpose: later local polish only, applies_to: none}
  primary_forms:
  - {type: cylinder, purpose: stacked base}
  - {type: tapered_box, purpose: column}
  - {type: sphere, purpose: skull}
  secondary_forms:
  - {type: tapered_box, purpose: jaw and snout}
  - {type: box, purpose: mane}
  - {type: cone, purpose: ears}
  tertiary_details:
  - {type: sphere, purpose: eyes}
  keep_parts: [socle, column, neck, skull, jaw, snout, mane_crest, ear]
  rebuild_parts: []
  notes:
  - Iteration 005 blockout is the ancestor
  - Do not replace named parts with a skin or sphere cloud
decomposition:
  mode: parts
  source_views: [side, silhouette_side, three_quarter]
  components:
  - {id: socle, role: primary, technique: box}
  - {id: column, role: primary, technique: box}
  - {id: neck, role: primary, technique: box}
  - {id: skull, role: primary, technique: box}
  - {id: jaw, role: secondary, technique: box}
  - {id: snout, role: secondary, technique: box}
  - {id: mane_crest, role: secondary, technique: box}
  joints:
  - {child: socle}
  - {child: column, parent: socle}
  - {child: neck, parent: column}
  - {child: skull, parent: neck}
  - {child: jaw, parent: skull}
  - {child: snout, parent: jaw}
  - {child: mane_crest, parent: skull}
type: static_prop
id: chess_knight
workflow: sculptural
name: Knight Chess Piece
