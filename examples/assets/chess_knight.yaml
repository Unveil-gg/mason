art_direction:
  subject: Staunton-style chess knight, carved horse head
  style:
    realism: 0.35
    stylization: 0.65
    shape_language: []
  usage:
    importance: hero
    viewing_distance: close
  silhouette: weighted turned base, backward-arched neck, compact carved head
  forms:
    primary: [turned socle, stem, arched neck, horse head]
    secondary: [muzzle, jaw, ears, mane crest]
    tertiary: [eyes]
  materials: []
  detail_density: high
  references:
  - path: examples/ref/staunton_knight.jpg
    purpose: silhouette
  - path: examples/ref/staunton_knight.jpg
    purpose: color
  constraints: []
geometric_plan:
  primary_read: sculptural side profile, not a literal horse
  recognition: silhouette
  must_survive_small:
  - turned weighted base
  - backward-arched neck
  - compact downward muzzle
  - two small rear ears
  masses:
  - name: socle
    role: primary
    notes: rotationally symmetric foot
  - name: stem
    role: primary
    connects_to: [socle, neck]
    notes: turned column
  - name: neck
    role: primary
    connects_to: [stem, skull]
    notes: thick S-curve, arches back then into the head
  - name: skull
    role: primary
    connects_to: [neck, muzzle]
    notes: rear mass and brow, not a long snout
  silhouette: >
    Side view is the identity view. Neck rises and bows toward +Y
    (away from the face), then the head hooks compactly toward -Y
    and slightly down. Distinguish from a cute/literal horse or
    llama by the short muzzle and heavy rear skull/mane.
  silhouette_vs_similar: >
    Not a toy horse on a stick. Not a long horizontal head.
    Ears are two small points at the poll, not one fused crest.
  proportions: >
    Base ~1/5 of height. Neck mass thicker than the muzzle.
    Muzzle shorter than the skull. Ears small vs the poll.
  symmetry: bilateral
  negative_space: notch under the jaw; gap behind the ears
  abstraction: stylized sculptural carving, not anatomical realism
  stage: silhouette
  landmarks:
  - {id: neck_base, role: neck base, part: upper, node: neck_base}
  - {id: neck_apex, role: rear neck apex, part: upper, node: neck_arch}
  - {id: withers, role: rear skull/mane mass, part: upper, node: withers}
  - {id: poll, role: poll, part: upper, node: poll}
  - {id: muzzle, role: muzzle root, part: upper, node: muzzle}
  - {id: nose, role: nose tip, part: upper, node: nose}
  - {id: jaw, role: lower jaw, part: upper, node: jaw}
  - {id: ear_l, role: left ear, part: upper, node: ear_l}
  - {id: ear_r, role: right ear, part: upper, node: ear_r}
  critical_views:
  - {view: silhouette_side, weight: 3}
  - {view: side, weight: 2}
  - {view: silhouette_front, weight: 1}
  - {view: front, weight: 0.5}
  - {view: three_quarter, weight: 1}
  notes:
  - Face -Y. +Y is the rear of the neck.
  - Side silhouette outranks the front view.
  - Bind critiques to these nodes; do not regenerate the whole head.
construction_plan:
  techniques:
  - kind: lathe
    purpose: turned socle and stem
    applies_to: base
  - kind: skin
    purpose: neck, skull, muzzle, jaw, ears
    applies_to: upper
  - kind: remesh
    purpose: continuous carved surface
    applies_to: head
  primary_forms:
  - type: lathe
    purpose: turned onyx socle
  - type: lathe
    purpose: turned mahogany stem
  - type: skin
    purpose: organic neck and head volume
  secondary_forms:
  - type: remesh
    purpose: join upper into one carved form
  tertiary_details:
  - type: sphere
    purpose: eyes
  materials:
  - bare_metal
  - plastic
  notes:
  - Face toward -Y so the front preview reads in profile
  - lathe/skin/remesh are general ops; the knight is a stress test
  - plastic stands in for polished mahogany
