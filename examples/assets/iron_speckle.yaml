type: layered_raster
id: iron_speckle
name: Iron Speckle

# Tiling iron albedo for style family bare_metal.
dimensions:
  width: 256
  height: 256

style: iron

layers:
  - name: base
    role: background
    fill: iron
  - name: dark
    role: fill
    fill: iron_dark
    rect: {x: 16, y: 20, width: 40, height: 18}
  - name: dark_2
    role: fill
    fill: iron_dark
    rect: {x: 120, y: 90, width: 28, height: 22}
  - name: dark_3
    role: fill
    fill: iron_dark
    rect: {x: 190, y: 180, width: 36, height: 16}
  - name: light
    role: fill
    fill: iron_light
    rect: {x: 70, y: 150, width: 24, height: 14}
  - name: light_2
    role: fill
    fill: iron_light
    rect: {x: 200, y: 40, width: 20, height: 20}

export:
  kra: true
  png: true
