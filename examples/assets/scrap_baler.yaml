type: static_prop
id: scrap_baler
workflow: prop
name: Small Baler

# Compact vertical baler for Scrap Paws. Tall cabinet, open
# hopper, manual lever, rear wheels, hazard toe plate.
dimensions:
  width: 0.80
  depth: 0.74
  height: 2.10

style: iron

