materials:
  strategy: family
  primary: teal
  palette_overrides:
    teal: "#19A7A5"
    teal_dark: "#1E4E48"
    hazard: "#C49810"

art_direction:
  subject: small vertical scrap baler
  style:
    realism: 0.4
    stylization: 0.6
    shape_language: [tall, boxy, levered, wheeled]
  usage:
    importance: standard_prop
    viewing_distance: medium
  focal_point: open hopper and raised compaction lever
  value_hierarchy: teal body, black wheels and grips, yellow toe
  silhouette: >
    Tall cabinet, open hopper flap, and a rear-pivoted lever
    with a T-handle over the mouth. Pulling the handle down
    shuts the flap. Two rear wheels and a striped toe plate.
  gameplay:
    camera: three_quarter
    on_screen_size: medium prop, about one character tall
    must_read: [cabinet, hopper, lever, wheels, hazard toe]
  recognition_details:
    - raised T-handle lever
    - open hopper mouth
    - rear wheel pair
    - yellow-black toe plate
  forms:
    primary: [cabinet, hopper, lever]
    secondary: [lid, wheels, door, toe_plate]
    tertiary: [latch, plaque, grips]
  materials:
    - {family: painted_metal, palette: teal}
    - {family: rubber, palette: rubber}
    - {family: bare_metal, palette: steel}
  detail_density: low
  asymmetry: latch on the right, plaque on the left
  references:
    - path: examples/ref/scrap_baler_ref.png
      purpose: silhouette
      view: three_quarter
    - path: examples/ref/scrap_baler_ref.png
      purpose: color
      view: three_quarter
  constraints:
    - low poly, primitives only
    - keep the lever and wheels large enough to read small

geometric_plan:
  primary_read: tall wheeled cabinet with a lever over an open mouth
  recognition: silhouette
  must_survive_small:
    - tall cabinet
    - lever and T-handle
    - rear wheels
    - open hopper
  masses:
    - {name: cabinet, role: primary, connects_to: [hopper, wheel]}
    - {name: hopper, role: primary, connects_to: [cabinet, lever]}
    - {name: lever, role: secondary, connects_to: [hopper]}
    - {name: wheel, role: secondary, connects_to: [cabinet]}
  silhouette: >
    Narrow tower, mouth at the top, stick and crossbar above,
    two discs at the rear base, a lip on the front floor.
  silhouette_vs_similar: >
    Not a dumpster, fridge, or crate. The lever and rear
    wheels make it a baler.
  proportions: >
    Cabinet about 0.64 wide, 0.50 deep, 0.90 tall. Lever
    carries the top to about 1.74.
  symmetry: local
  negative_space: hopper mouth under the propped lid
  abstraction: chunky boxes and cylinders, no ram internals
  stage: secondary
  landmarks:
    - {id: cabinet, role: body, part: cabinet}
    - {id: mouth, role: hopper opening, part: hopper_mouth}
    - {id: lever, role: compaction arm, part: lever}
    - {id: handle, role: T-bar, part: handle}
    - {id: wheel, role: rear wheel, part: wheel}
    - {id: toe, role: hazard plate, part: toe_plate}
  critical_views:
    - {view: three_quarter, weight: 3}
    - {view: side, weight: 2}
    - {view: front, weight: 2}

construction_plan:
  techniques:
    - {kind: box, purpose: cabinet hopper door lever, applies_to: body}
    - {kind: lathe, purpose: wheels and pivot, applies_to: wheel}
  primary_forms:
    - {type: box, purpose: cabinet}
    - {type: box, purpose: hopper walls}
    - {type: box, purpose: lever}
  secondary_forms:
    - {type: cylinder, purpose: rear wheels, count: 2}
    - {type: box, purpose: propped lid}
    - {type: box, purpose: hazard toe plate}
  tertiary_details:
    - {type: box, purpose: door latch and label}
  materials: [painted_metal, rubber, bare_metal]
  notes:
    - One spec. Two primary masses, repeated wheels only.
    - No baler recipe.

art_analysis:
  shape_language:
    edges: hard
  proportions:
    height_width_ratio: 1.506
  palette_distribution:
    dominant: "#9DA195"
    secondary: "#1E4E48"
    accent: "#19A7A5"
  source_size:
    width: 451
    height: 679

attachments:
  - name: flap
    location: [0.0, 0.20, 1.22]
    rotation: [-0.95, 0.0, 0.0]
    parent: flap_hinge
  - name: ram
    location: [0.0, 0.0, 0.42]
    parent: ram

metadata:
  flap_axis: x
  flap_open: "-0.95"
  flap_closed: "0.0"
  ram_open_z: "0.42"
  ram_closed_z: "0.18"
  mechanism: >
    Y and T-handle are parented to the lid.
    Rotate flap_hinge on X from -0.95 toward 0.
    The handle drops and the lid shuts together.
    Slide ram down on Z to compress. No baked clip.

export:
  format: glb
  save_blend: true
