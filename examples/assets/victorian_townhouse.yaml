art_direction:
  subject: Queen Anne house on a small lot
  style:
    realism: 0.4
    stylization: 0.6
    shape_language: [asymmetric, turret, cross_gable]
  usage:
    importance: focal_prop
    viewing_distance: medium
  silhouette: >
    L-plan house, corner turret with a conical hat, crossing
    gables, deep wrap porch as a room, lawn and path.
  forms:
    primary: [L body, turret, cross gables]
    secondary: [porch room, hat, lot]
    tertiary: [cut windows, chimney, tree]
  detail_density: medium
  constraints:
  - "Big masses, not sticker trim. Porch is a volume."
  references:
  - path: examples/ref/queen_anne_victorian.png
    purpose: silhouette
    view: three_quarter
  - path: .mason/jobs/victorian_townhouse/refs/Queen_Anne_House_Los_Angeles.jpg
    purpose: style
    view: three_quarter
geometric_plan:
  primary_read: Queen Anne on a lot, not a peach box
  recognition: silhouette
  must_survive_small:
  - corner turret and conical hat
  - crossing gables
  - deep wrap porch
  masses:
  - {name: lawn, role: primary, connects_to: [path, body]}
  - {name: body, role: primary, connects_to: [wing, turret, roof]}
  - {name: wing, role: primary, connects_to: [body, turret, gable]}
  - {name: turret, role: primary, connects_to: [wing, hat]}
  - {name: porch, role: secondary, connects_to: [body, turret]}
  silhouette: >
    Three-quarter: turret right-front, front gable left,
    side gable behind, porch under a real roof. Lawn reads.
  silhouette_vs_similar: Not an NYC stoop slab. Not a mansion.
  proportions: Turret taller than the L. Porch ~half the depth of the body.
  symmetry: asymmetric
  negative_space: porch room under its roof
  abstraction: named masses, no remesh
  stage: secondary
  landmarks:
  - {id: turret, role: corner tower, part: turret}
  - {id: hat, role: conical cap, part: hat}
  - {id: gable, role: front gable, part: roof}
  - {id: porch, role: porch room, part: porch}
  critical_views:
  - {view: three_quarter, weight: 3}
  - {view: front, weight: 2}
  - {view: side, weight: 2}
  notes:
  - Face -Y. Lot under the house. No NYC areaway.
construction_plan:
  techniques:
  - {kind: box, purpose: L plan porch lot, applies_to: mass}
  - {kind: modular, purpose: turret cone cross gable, applies_to: mass}
  primary_forms:
  - {type: box, purpose: lawn body wing porch}
  - {type: cylinder, purpose: corner turret}
  secondary_forms:
  - {type: tapered_box, purpose: crossing gables}
  - {type: cone, purpose: turret hat}
  - {type: cornice, purpose: eave}
  notes:
  - Composition first. Dark cutouts, no cream plates.
type: static_prop
