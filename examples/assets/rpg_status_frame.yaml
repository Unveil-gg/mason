type: layered_raster
id: rpg_status_frame
name: RPG Status Frame

dimensions:
  width: 640
  height: 360

style: medieval

layers:
  - name: wood
    role: background
    fill: wood
  - name: wood_grain
    role: overlay
    fill: wood_light
    stamp: speckle
    stamp_inner: wood
    stamp_seed: 11
    rect: {x: 0, y: 0, width: 640, height: 360}
  - name: gold_outer
    role: fill
    fill: gold_dark
    rect: {x: 12, y: 12, width: 616, height: 336}
  - name: field
    role: fill
    fill: parchment
    rect: {x: 20, y: 20, width: 600, height: 320}
  - name: field_grain
    role: overlay
    fill: gold_dark
    stamp: speckle
    stamp_inner: parchment
    stamp_seed: 24
    opacity: 0.85
    rect: {x: 20, y: 20, width: 600, height: 320}
  - name: field_vignette
    role: overlay
    fill: wood
    stamp: vignette
    rect: {x: 24, y: 24, width: 592, height: 312}
  - name: rule_top
    role: fill
    fill: gold
    stamp: rule
    rect: {x: 28, y: 26, width: 584, height: 4}
  - name: rule_bot
    role: fill
    fill: gold
    stamp: rule
    rect: {x: 28, y: 330, width: 584, height: 4}
  - name: c_tl
    role: fill
    fill: gold
    stamp: l_corner
    stamp_corner: tl
    rect: {x: 24, y: 24, width: 22, height: 22}
  - name: c_tr
    role: fill
    fill: gold
    stamp: l_corner
    stamp_corner: tr
    rect: {x: 594, y: 24, width: 22, height: 22}
  - name: c_bl
    role: fill
    fill: gold
    stamp: l_corner
    stamp_corner: bl
    rect: {x: 24, y: 314, width: 22, height: 22}
  - name: c_br
    role: fill
    fill: gold
    stamp: l_corner
    stamp_corner: br
    rect: {x: 594, y: 314, width: 22, height: 22}
  - name: portrait
    role: fill
    fill: wood_light
    rect: {x: 36, y: 48, width: 96, height: 112}
  - name: portrait_gem
    role: fill
    fill: gold
    stamp: gem
    rect: {x: 68, y: 80, width: 32, height: 32}
  - name: name
    role: text
    text: HERO
    fill: ink
    font_size: 28
    align: left
    font: Times New Roman
    rect: {x: 148, y: 48, width: 220, height: 36}
  - name: hp_back
    role: fill
    fill: wood
    rect: {x: 148, y: 96, width: 280, height: 18}
  - name: hp
    role: fill
    fill: gem
    rect: {x: 150, y: 98, width: 220, height: 14}
  - name: mp_back
    role: fill
    fill: wood
    rect: {x: 148, y: 122, width: 280, height: 18}
  - name: mp
    role: fill
    fill: gold_dark
    rect: {x: 150, y: 124, width: 160, height: 14}
  - name: hp_label
    role: text
    text: HP
    fill: ink
    font_size: 16
    align: left
    font: Times New Roman
    rect: {x: 436, y: 92, width: 48, height: 22}
  - name: mp_label
    role: text
    text: MP
    fill: ink
    font_size: 16
    align: left
    font: Times New Roman
    rect: {x: 436, y: 118, width: 48, height: 22}

art_direction:
  subject: classic RPG status screen frame
  silhouette: landscape parchment panel with portrait well
  detail_density: medium

export:
  kra: true
  png: true
