type: layered_raster
id: noir_billboard_face
name: Noir Billboard Face

# Wide highway poster. Ellipse spotlight + figure stamp + vignette.
dimensions:
  width: 960
  height: 280

style: default

layers:
  - name: bg
    role: background
    fill: ink
  - name: spotlight
    role: fill
    fill: charcoal
    shape: ellipse
    rect: {x: 24, y: 16, width: 300, height: 248}
  - name: spotlight_inner
    role: fill
    fill: smoke
    shape: ellipse
    rect: {x: 64, y: 40, width: 220, height: 200}
  - name: detective
    role: fill
    fill: ink
    stamp: figure
    rect: {x: 96, y: 28, width: 160, height: 230}
  - name: frame
    role: overlay
    fill: cream
    stamp: vignette
    rect: {x: 10, y: 8, width: 940, height: 264}
  - name: title
    role: text
    text: MIDNIGHT ALIBI
    fill: cream
    font_size: 48
    align: left
    rect: {x: 350, y: 36, width: 590, height: 72}
  - name: divider
    role: fill
    fill: cream
    rect: {x: 350, y: 118, width: 400, height: 4}
  - name: tagline
    role: text
    text: SHE KNEW TOO MUCH
    fill: cream
    font_size: 26
    align: left
    rect: {x: 350, y: 140, width: 590, height: 40}
  - name: credit
    role: text
    text: A NOIR PICTURE
    fill: cream
    font_size: 16
    align: left
    rect: {x: 350, y: 220, width: 590, height: 28}

art_direction:
  subject: wide noir highway poster
  usage:
    importance: standard_prop
    viewing_distance: far
  silhouette: wide 3.4:1 rectangle, detective left, title right
  forms:
    primary: [poster field, detective mass, title block]
    secondary: [hat brim, coat, divider, vignette]
    tertiary: [credit line]
  detail_density: low

export:
  kra: true
  png: true
