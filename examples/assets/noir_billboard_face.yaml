type: layered_raster
id: noir_billboard_face
name: Noir Billboard Face

# Wide highway poster (~3.4:1), not a square movie-poster tile.
# Detective silhouette occupies the left; title reads across the right.
dimensions:
  width: 960
  height: 280

style: default

layers:
  - name: bg
    role: background
    fill: ink
  - name: spotlight
    role: fill
    fill: charcoal
    rect: {x: 24, y: 20, width: 280, height: 240}
  - name: spotlight_inner
    role: fill
    fill: smoke
    rect: {x: 56, y: 40, width: 216, height: 200}
  - name: hat_crown
    role: fill
    fill: ink
    rect: {x: 148, y: 28, width: 40, height: 22}
  - name: hat_brim
    role: fill
    fill: ink
    rect: {x: 124, y: 46, width: 88, height: 10}
  - name: head
    role: fill
    fill: ink
    rect: {x: 154, y: 56, width: 28, height: 20}
  - name: shoulders
    role: fill
    fill: ink
    rect: {x: 128, y: 74, width: 80, height: 20}
  - name: coat_upper
    role: fill
    fill: ink
    rect: {x: 118, y: 92, width: 100, height: 56}
  - name: coat_lower
    role: fill
    fill: ink
    rect: {x: 96, y: 146, width: 144, height: 94}
  - name: title
    role: text
    text: MIDNIGHT ALIBI
    fill: cream
    font_size: 48
    rect: {x: 330, y: 36, width: 610, height: 72}
  - name: divider
    role: fill
    fill: cream
    rect: {x: 330, y: 118, width: 420, height: 4}
  - name: tagline
    role: text
    text: SHE KNEW TOO MUCH
    fill: cream
    font_size: 26
    rect: {x: 330, y: 140, width: 610, height: 40}
  - name: credit
    role: text
    text: A NOIR PICTURE
    fill: cream
    font_size: 16
    rect: {x: 330, y: 220, width: 610, height: 28}

export:
  kra: true
  png: true
