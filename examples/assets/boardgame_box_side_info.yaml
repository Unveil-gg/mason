type: layered_raster
id: boardgame_box_side_info
name: Harvest Hollow Box Side (Player Count and Time)

dimensions:
  width: 1024
  height: 256

style: harvest

layers:
  - name: background
    role: background
    fill: cream
  - name: dusk
    role: overlay
    fill: accent
    opacity: 0.35
    rect: {x: 0, y: 0, width: 1024, height: 256}
    expression:
      formula: clamp(1 - v * 1.4, 0, 1)
      mode: alpha
  - name: grain
    role: overlay
    fill: wood_light
    opacity: 0.4
    rect: {x: 0, y: 0, width: 1024, height: 256}
    expression:
      formula: noise(u * 24, v * 8, seed) * 0.45
      mode: alpha
      seed: 9
  - name: header_band
    role: fill
    fill: wood_dark
    opacity: 0.88
    rect: {x: 0, y: 0, width: 1024, height: 36}
  - name: header_text
    role: text
    text: Harvest Hollow
    fill: cream
    font_size: 22
    align: center
    rect: {x: 20, y: 4, width: 984, height: 28}
  - name: figure_1
    role: fill
    fill: ink
    stamp: figure
    rect: {x: 70, y: 48, width: 60, height: 120}
  - name: figure_2
    role: fill
    fill: ink
    stamp: figure
    rect: {x: 160, y: 48, width: 60, height: 120}
  - name: figure_3
    role: fill
    fill: ink
    stamp: figure
    rect: {x: 250, y: 48, width: 60, height: 120}
  - name: figure_4
    role: fill
    fill: ink
    stamp: figure
    rect: {x: 340, y: 48, width: 60, height: 120}
  - name: players_text
    role: text
    text: 2-4 Players
    fill: wood_dark
    font_size: 32
    align: center
    rect: {x: 40, y: 184, width: 440, height: 48}
  - name: divider
    role: fill
    fill: wood_dark
    stamp: rule
    rect: {x: 502, y: 48, width: 20, height: 180}
  - name: clock_icon
    role: fill
    fill: brass
    stamp: gem
    stamp_inner: cream
    rect: {x: 722, y: 48, width: 120, height: 120}
  - name: time_text
    role: text
    text: 45-60 Min
    fill: wood_dark
    font_size: 32
    align: center
    rect: {x: 584, y: 184, width: 400, height: 48}
  - name: frame_vignette
    role: overlay
    fill: wood_dark
    stamp: vignette
    rect: {x: 0, y: 0, width: 1024, height: 256}

art_direction:
  subject: board game box side panel, player count and play time
  usage:
    importance: standard_prop
    viewing_distance: close
  detail_density: medium

export:
  kra: true
  png: true
