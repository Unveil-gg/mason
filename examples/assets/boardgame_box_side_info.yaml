type: layered_raster
id: boardgame_box_side_info
name: Harvest Hollow Box Side (Player Count and Time)

dimensions:
  width: 1024
  height: 256

style: default

layers:
  - name: background
    role: background
    fill: cream
  - name: grain
    role: overlay
    fill: wood_light
    stamp: speckle
    stamp_inner: cream
    stamp_seed: 9
    rect: {x: 0, y: 0, width: 1024, height: 256}
  - name: figure_1
    role: fill
    fill: ink
    stamp: figure
    rect: {x: 70, y: 40, width: 60, height: 140}
  - name: figure_2
    role: fill
    fill: ink
    stamp: figure
    rect: {x: 160, y: 40, width: 60, height: 140}
  - name: figure_3
    role: fill
    fill: ink
    stamp: figure
    rect: {x: 250, y: 40, width: 60, height: 140}
  - name: figure_4
    role: fill
    fill: ink
    stamp: figure
    rect: {x: 340, y: 40, width: 60, height: 140}
  - name: players_text
    role: text
    text: 2-4 Players
    fill: wood_dark
    font_size: 34
    align: center
    rect: {x: 40, y: 196, width: 440, height: 48}
  - name: divider
    role: fill
    fill: wood_dark
    stamp: rule
    rect: {x: 502, y: 20, width: 20, height: 216}
  - name: clock_icon
    role: fill
    fill: brass
    stamp: gem
    stamp_inner: cream
    rect: {x: 722, y: 30, width: 140, height: 140}
  - name: time_text
    role: text
    text: 45-60 Min
    fill: wood_dark
    font_size: 34
    align: center
    rect: {x: 584, y: 196, width: 400, height: 48}
  - name: frame_vignette
    role: overlay
    fill: ink
    stamp: vignette
    rect: {x: 0, y: 0, width: 1024, height: 256}

art_direction:
  subject: board game box side panel, player count and play time icons
  usage:
    importance: standard_prop
    viewing_distance: close
  detail_density: medium

export:
  kra: true
  png: true
