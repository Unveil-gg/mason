type: image_process
id: barbarian_sheet
name: Barbarian NES Spritesheet

# 128x96, a 4-col x 3-row grid of 32px cells: row 0 = idle (2 frames),
# row 1 = walk (4 frames), row 2 = attack (3 frames). Unused cells
# stay transparent, same as most hand-authored sprite sheets. Build
# every barbarian_* frame asset first -- this reads their
# output/asset.png files by asset id. barbarian_idle is also the
# base canvas (its own frame already sits at row 0, col 0).
source:
  asset: barbarian_idle
  file: output/asset.png

operations:
  # Row 0: idle (frame 1 baked into the base above; frame 2 here).
  - op: composite
    asset: barbarian_idle2
    file: output/asset.png
    gravity: northwest
    offset_x: 32
    offset_y: 0

  # Row 1: walk cycle, left-forward -> pass -> right-forward -> pass.
  - op: composite
    asset: barbarian_walk1
    file: output/asset.png
    gravity: northwest
    offset_x: 0
    offset_y: 32
  - op: composite
    asset: barbarian_walk3
    file: output/asset.png
    gravity: northwest
    offset_x: 32
    offset_y: 32
  - op: composite
    asset: barbarian_walk2
    file: output/asset.png
    gravity: northwest
    offset_x: 64
    offset_y: 32
  - op: composite
    asset: barbarian_walk4
    file: output/asset.png
    gravity: northwest
    offset_x: 96
    offset_y: 32

  # Row 2: attack swing, windup -> strike -> follow-through.
  - op: composite
    asset: barbarian_attack
    file: output/asset.png
    gravity: northwest
    offset_x: 0
    offset_y: 64
  - op: composite
    asset: barbarian_attack2
    file: output/asset.png
    gravity: northwest
    offset_x: 32
    offset_y: 64
  - op: composite
    asset: barbarian_attack3
    file: output/asset.png
    gravity: northwest
    offset_x: 64
    offset_y: 64

export:
  format: png
