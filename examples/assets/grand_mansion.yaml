type: static_prop
id: grand_mansion
workflow: building
name: Grand Mansion

# Estate recipe: house, garden, pool. Surfaces from 2D tiles.
dimensions:
  width: 4.20
  depth: 5.40
  height: 2.50

style: estate

geometry:
  bevel: true
  recipe: estate
  recipe_params:
    wing_width: 1.08
    tree_height: 1.45
    pool_width: 1.78
    pool_depth: 1.02
    include_portico: false

materials:
  primary: stone

depends_on:
  - estate_stone_q
  - estate_shingle_q
  - estate_water_q

decomposition:
  mode: parts
  source_views: [three_quarter, front]
  components:
  - {id: house, role: primary, technique: box}
  - {id: roof, role: primary, technique: box}
  - {id: garden, role: secondary, technique: box}
  - {id: pool, role: secondary, technique: box}
  joints:
  - {child: house}
  - {child: roof, parent: house}
  - {child: garden, parent: house}
  - {child: pool, parent: garden}

art_direction:
  subject: grand estate mansion with formal garden and rear pool
  style:
    realism: 0.4
    stylization: 0.6
    shape_language: [axial, terraced, classical]
  usage:
    importance: focal_prop
    viewing_distance: medium
  focal_point: central pediment and portico
  gameplay:
    camera: three_quarter
    must_read: [hip roof, portico, rear pool]
  silhouette: >
    Wide house with central pediment and chimneys, low front
    garden masses, rear rectangle of water against a hedge.
  forms:
    primary: [house mass, pitched roof, lawns, pool]
    secondary: [wings, portico columns, hedges, fountain]
    tertiary: [cut windows, door, chimneys, topiary, trees]
  materials:
    - {family: masonry, palette: stone}
    - {family: roofing, palette: roof}
    - {family: foliage, palette: lawn}
    - {family: water, palette: water}
  detail_density: medium

construction_plan:
  primary_forms:
    - {type: box, purpose: lot lawns house and pool}
    - {type: tapered_box, purpose: hip roofs and pediment}
  secondary_forms:
    - {type: cylinder, purpose: portico columns}
    - {type: cornice, purpose: eave molding}
    - {type: rail, purpose: pool coping}
    - {type: box, purpose: hedges and parterre}
  tertiary_details:
    - {type: cutout, purpose: window recesses and pool basin}
    - {type: sphere, purpose: rear trees}
    - {type: sphere, purpose: topiary}
  materials: [masonry, roofing, foliage, water]
  notes:
    - recipe estate expands house tree and pool clusters
    - family albedo tiles when the 2D assets exist
    - cutout subtracts then discards the cutter

export:
  format: glb
  save_blend: true
