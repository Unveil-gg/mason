type: sprite_sheet
id: swordsman
name: Swordsman

# 32x32 NES-style swordsman, side-on, facing right. Reuses the same
# "nes" style palette as barbarian.yaml for a cohesive character set:
# walk (4-frame loop) and attack (3-frame sword swing, one-shot).
