# Cover-crop the 16:9 generate to the box-side 4:1. A Krita file
# layer keeps native aspect and letterboxes; ImageMagick cover
# fills the face. No title overlay -- the lid already carries type.
type: image_process
id: harvest_hollow_ai_promo
name: Harvest Hollow Promo Side

style: harvest

source:
  path: examples/ref/harvest_hollow_ai_promo.png

operations:
  - op: resize
    width: 1024
    height: 256
    fit: cover
