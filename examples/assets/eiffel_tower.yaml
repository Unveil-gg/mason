materials:
  primary: iron

art_direction:
  subject: stylized Eiffel Tower landmark
  style:
    realism: 0.3
    stylization: 0.7
    shape_language: [tapered, lattice, iron]
  usage:
    importance: focal_prop
    viewing_distance: medium
  silhouette: >
    Tall slim taper, open lattice, thin deck rails, needle
    spire. Not a squat industrial radio mast.
  forms:
    primary: [splayed thin legs, decks, spire]
    secondary: [X-braces all faces, arch beams, rails]
    tertiary: [antenna]
  materials:
    - {family: bare_metal, palette: iron}
  detail_density: medium

construction_plan:
  primary_forms:
    - {type: box, purpose: thin splayed legs}
    - {type: box, purpose: thin deck plates}
  secondary_forms:
    - {type: x_brace, purpose: lattice faces}
    - {type: rail, purpose: deck rails}
  tertiary_details:
    - {type: cylinder, purpose: antenna}
  materials: [bare_metal]
  notes:
    - x_brace plus rail, not one box per member
    - do not chase a measured replica

export:
  format: glb
  save_blend: true
