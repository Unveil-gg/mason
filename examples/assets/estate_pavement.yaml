type: layered_raster
id: estate_pavement
name: Estate Pavement

dimensions:
  width: 256
  height: 256

style: estate

layers:
  - name: base
    role: background
    fill: path
  - name: slabs
    role: fill
    fill: path_dark
    stamp: pavers
    rect: {x: 0, y: 0, width: 256, height: 256}
  - name: grit
    role: overlay
    fill: path_dark
    stamp: speckle
    stamp_seed: 11
    rect: {x: 0, y: 0, width: 256, height: 256}

export:
  kra: true
  png: true
