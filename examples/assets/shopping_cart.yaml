type: static_prop
id: shopping_cart
name: Shopping Cart

# Grocery cart via the cart recipe: flared rim, snapped walls, handle.
dimensions:
  width: 0.60
  depth: 0.50
  height: 0.78

style: iron

geometry:
  bevel: true
  recipe: cart
  recipe_params:
    flare: 0.18
    basket_height: 0.42
    handle_rise: 0.16

materials:
  primary: steel

# One extra sibling job (shopping_cart_black) built automatically
# from this same geometry, with the steel palette swapped darker.
variants:
  - suffix: black
    palette_overrides:
      steel: "#2B2E31"
      steel_dark: "#1A1C1E"

art_direction:
  subject: wire grocery shopping cart
  style:
    realism: 0.4
    stylization: 0.6
    shape_language: [flared, wire, nestable]
  usage:
    importance: standard_prop
    viewing_distance: medium
  silhouette: >
    Flared basket wider at the rim than the floor, four casters,
    short handle aft of the back rim, child-seat flap.
  forms:
    primary: [flared basket, short handle, casters]
    secondary: [rim rail, mid hoop, child seat]
    tertiary: [red grip, caster forks]
  materials:
    - {family: bare_metal, palette: steel}
    - {family: rubber, palette: rubber}
    - {family: painted_metal, palette: handle}
  detail_density: medium

construction_plan:
  primary_forms:
    - {type: rail, purpose: flared rim}
    - {type: cylinder, purpose: short aft handle}
  secondary_forms:
    - {type: wire_wall, purpose: basket sides}
    - {type: caster, purpose: wheels, count: 4}
    - {type: box, purpose: child-seat flap}
  tertiary_details:
    - {type: cylinder, purpose: red grip}
  materials: [bare_metal, rubber]
  notes:
    - rim wider than floor so the front reads nestable
    - walls snap to the floor; handle posts snap to the rim

decomposition:
  mode: parts
  source_views: [three_quarter, side]
  components:
  - {id: basket, role: primary, technique: modular}
  - {id: handle, role: secondary, technique: box}
  - {id: caster, role: secondary, technique: modular, instance_of: caster}
  joints:
  - {child: basket}
  - {child: handle, parent: basket}
  - {child: caster, parent: basket}

export:
  format: glb
  save_blend: true
