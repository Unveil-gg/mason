type: static_prop
id: shopping_cart
name: Shopping Cart

# Basket and casters are separate jobs. Assemble instances them.
dimensions:
  width: 0.60
  depth: 0.50
  height: 0.73

style: iron

depends_on:
  - shopping_cart__basket
  - shopping_cart__caster

geometry:
  bevel: true
  parts:
  - name: basket
    shape: instance
    source: {asset: shopping_cart__basket, file: output/asset.glb}
    size: [0.60, 0.50, 0.70]
    location: [0.0, 0.0, 0.0]
  - name: wheel_fl
    shape: instance
    source: {asset: shopping_cart__caster, file: output/asset.glb}
    size: [0.08, 0.12, 0.12]
    location: [-0.197, -0.156, 0.0]
    parent: basket
  - name: wheel_fr
    shape: instance
    source: {asset: shopping_cart__caster, file: output/asset.glb}
    size: [0.08, 0.12, 0.12]
    location: [0.197, -0.156, 0.0]
    parent: basket
    mirror: x
  - name: wheel_bl
    shape: instance
    source: {asset: shopping_cart__caster, file: output/asset.glb}
    size: [0.08, 0.12, 0.12]
    location: [-0.197, 0.156, 0.0]
    parent: basket
  - name: wheel_br
    shape: instance
    source: {asset: shopping_cart__caster, file: output/asset.glb}
    size: [0.08, 0.12, 0.12]
    location: [0.197, 0.156, 0.0]
    parent: basket
    mirror: x

materials:
  primary: steel

variants:
  - suffix: black
    palette_overrides:
      steel: "#2B2E31"
      steel_dark: "#1A1C1E"

art_direction:
  subject: wire grocery shopping cart
  style:
    realism: 0.4
    stylization: 0.6
    shape_language: [flared, wire, nestable]
  usage:
    importance: standard_prop
    viewing_distance: medium
  silhouette: >
    Flared basket wider at the rim than the floor, four casters,
    short handle aft of the back rim, child-seat flap.
  forms:
    primary: [flared basket, short handle, casters]
    secondary: [rim rail, mid hoop, child seat]
    tertiary: [red grip, caster forks]
  materials:
    - {family: bare_metal, palette: steel}
    - {family: rubber, palette: rubber}
    - {family: painted_metal, palette: handle}
  detail_density: medium

construction_plan:
  primary_forms:
    - {type: instance, purpose: basket job}
    - {type: instance, purpose: reused caster, count: 4}
  notes:
    - assets mode. Evaluate basket and caster, then assemble.

decomposition:
  mode: assets
  source_views: [three_quarter, side]
  components:
  - id: basket
    role: primary
    technique: modular
    asset: shopping_cart__basket
    dimensions: {width: 0.60, depth: 0.50, height: 0.73}
  - id: caster
    role: secondary
    technique: modular
    asset: shopping_cart__caster
    instance_of: caster
    dimensions: {width: 0.08, depth: 0.12, height: 0.12}
  joints:
  - {child: basket}
  - child: caster
    parent: basket
    parent_socket: wheel_fl
    location: [-0.197, -0.156, 0.0]
    copies:
    - {parent_socket: wheel_fr, location: [0.197, -0.156, 0.0], mirror: x}
    - {parent_socket: wheel_bl, location: [-0.197, 0.156, 0.0]}
    - {parent_socket: wheel_br, location: [0.197, 0.156, 0.0], mirror: x}

export:
  format: glb
  save_blend: true
