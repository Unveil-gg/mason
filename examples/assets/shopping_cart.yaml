materials:
  primary: steel

art_direction:
  subject: wire grocery shopping cart
  style:
    realism: 0.4
    stylization: 0.6
    shape_language: [tapered, wire, nestable]
  usage:
    importance: standard_prop
    viewing_distance: medium
  silhouette: >
    Deep basket taller than the handle rise, four casters,
    short rear U-handle, child-seat flap in the back.
  forms:
    primary: [deep basket, short handle, casters]
    secondary: [rim, mid hoop, child seat]
    tertiary: [red grip, caster forks]
  materials:
    - {family: bare_metal, palette: steel}
    - {family: rubber, palette: rubber}
    - {family: painted_metal, palette: handle}
  detail_density: medium

construction_plan:
  primary_forms:
    - {type: box, purpose: "smaller floor, larger rim"}
    - {type: cylinder, purpose: short rear handle}
  secondary_forms:
    - {type: box, purpose: wire bars and mid hoop}
    - {type: caster, purpose: wheels, count: 4}
    - {type: box, purpose: child-seat flap}
  tertiary_details:
    - {type: cylinder, purpose: red grip}
  materials: [bare_metal, rubber]
  notes:
    - basket depth must dominate the silhouette
    - handle stays just above the back rim
    - do not read as a laundry trolley

export:
  format: glb
  save_blend: true
