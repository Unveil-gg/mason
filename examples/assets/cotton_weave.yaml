type: layered_raster
id: cotton_weave
name: Cotton Weave

# Height map for fabric bump. expression.mode height is the 2D
# shader: a sandboxed formula baked to grayscale.
dimensions:
  width: 128
  height: 128

style: default

layers:
  - name: weave
    role: fill
    fill: cream
    rect: {x: 0, y: 0, width: 128, height: 128}
    expression:
      formula: >
        0.5 + 0.16 * sin(u * 36) * sin(v * 36)
        + 0.06 * sin(u * 72)
      mode: height
      seed: 3

export:
  kra: true
  png: true
