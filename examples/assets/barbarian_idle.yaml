type: layered_raster
id: barbarian_idle
name: Barbarian Idle (sheet base, frame 0)

# 128x32 canvas: this is also the base image the spritesheet is
# assembled onto (see barbarian_sheet.yaml). Only the first 32px
# column holds pixels; the rest stays transparent until the other
# frames are composited on top of it.
dimensions:
  width: 128
  height: 32

style: nes

layers:
  - name: hair
    role: fill
    fill: hair
    rect: {x: 12, y: 2, width: 8, height: 4}
  - name: head
    role: fill
    fill: skin
    rect: {x: 12, y: 6, width: 8, height: 7}
  - name: torso
    role: fill
    fill: cloth
    rect: {x: 10, y: 13, width: 12, height: 9}
  - name: belt
    role: fill
    fill: hair
    rect: {x: 10, y: 20, width: 12, height: 2}
  - name: left_arm
    role: fill
    fill: skin
    rect: {x: 7, y: 14, width: 3, height: 8}
  - name: right_arm
    role: fill
    fill: skin
    rect: {x: 22, y: 14, width: 3, height: 8}
  - name: left_leg
    role: fill
    fill: skin
    rect: {x: 12, y: 22, width: 4, height: 9}
  - name: right_leg
    role: fill
    fill: skin
    rect: {x: 16, y: 22, width: 4, height: 9}

export:
  kra: true
  png: true
