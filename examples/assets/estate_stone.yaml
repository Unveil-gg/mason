type: layered_raster
id: estate_stone
name: Estate Stone

dimensions:
  width: 256
  height: 256

style: estate

layers:
  - name: base
    role: background
    fill: stone
  - name: mortar
    role: fill
    fill: stone_dark
    stamp: bond
    rect: {x: 0, y: 0, width: 256, height: 256}
  - name: chip
    role: overlay
    fill: cream
    rect: {x: 12, y: 40, width: 10, height: 8}

export:
  kra: true
  png: true
