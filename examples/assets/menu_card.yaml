type: layered_raster
id: menu_card
name: Menu Card

dimensions:
  width: 1024
  height: 1536

style: default

layers:
  - name: background
    role: background
    fill: cream
  - name: bg_warmth
    role: fill
    fill: wood_light
    shape: ellipse
    opacity: 0.14
    rect: {x: 180, y: 420, width: 664, height: 900}
  - name: bg_grain
    role: overlay
    fill: wood_dark
    stamp: speckle
    stamp_inner: cream
    stamp_seed: 7
    rect: {x: 0, y: 220, width: 1024, height: 1316}
  - name: header_band
    role: fill
    fill: wood_dark
    rect: {x: 0, y: 0, width: 1024, height: 220}
  - name: header_grain
    role: overlay
    fill: wood_light
    stamp: speckle
    stamp_inner: wood_dark
    stamp_seed: 19
    rect: {x: 0, y: 0, width: 1024, height: 220}
  - name: title
    role: text
    fill: cream
    text: Cafe
    font_size: 72
    rect: {x: 40, y: 40, width: 944, height: 140}
  - name: accent_bar
    role: overlay
    fill: accent
    rect: {x: 80, y: 260, width: 864, height: 10}
  - name: swatch
    role: image
    image: examples/ref/swatch.png
    rect: {x: 80, y: 300, width: 256, height: 128}

export:
  kra: true
  png: true
