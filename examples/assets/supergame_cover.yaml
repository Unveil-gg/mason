type: layered_raster
id: supergame_cover
workflow: illustrated
name: Live Wire Cover

dimensions:
  width: 768
  height: 1024

style: supergame

layers:
  - name: navy
    role: background
    fill: navy
  - name: painting
    role: image
    image: examples/ref/live_wire_cover.png
    rect: {x: 0, y: 0, width: 768, height: 1024}
  - name: banner
    role: fill
    fill: navy_dark
    opacity: 0.88
    rect: {x: 0, y: 0, width: 768, height: 168}
  - name: gold_rule
    role: fill
    fill: gold
    rect: {x: 0, y: 168, width: 768, height: 6}
  - name: binding
    role: text
    text: SUPERGAME
    fill: gold
    font_size: 36
    align: center
    rect: {x: 40, y: 16, width: 688, height: 48}
  - name: title
    role: text
    text: LIVE WIRE
    fill: yellow
    font_size: 64
    align: center
    rect: {x: 40, y: 68, width: 688, height: 80}
  - name: vignette
    role: overlay
    fill: navy_dark
    stamp: vignette
    opacity: 0.4
    rect: {x: 0, y: 0, width: 768, height: 1024}

art_direction:
  subject: SNES SuperGame box lid, electrician versus live wires
  style:
    realism: 0.4
    stylization: 0.6
    shape_language: [painted, electric, cartridge]
  usage:
    importance: hero
    viewing_distance: close
  focal_point: hard-hat electrician locked with a wire serpent
  value_hierarchy: gold SuperGame bar, yellow hat, cyan wires, navy field
  silhouette: portrait cart
  gameplay:
    camera: front
    must_read: [SUPERGAME, LIVE WIRE, electrician, wires]
  recognition_details: [hard hat, pliers, electric serpent]
  detail_density: high

export:
  kra: true
  png: true
