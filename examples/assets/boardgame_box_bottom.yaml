    font_size: 34
    align: left
    rect: {x: 60, y: 350, width: 400, height: 44}
  - name: comp_icon_1
    role: fill
    fill: ink
    stamp: figure
    rect: {x: 70, y: 420, width: 70, height: 140}
  - name: comp_icon_2
    role: fill
    fill: ink
    stamp: figure
    rect: {x: 170, y: 420, width: 70, height: 140}
  - name: comp_icon_3
    role: fill
    fill: ink
