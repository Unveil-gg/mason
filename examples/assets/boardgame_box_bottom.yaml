type: layered_raster
id: boardgame_box_bottom
name: Harvest Hollow Box Bottom

dimensions:
  width: 1024
  height: 1024

style: harvest

layers:
  - name: background
    role: background
    fill: cream
  - name: grain
    role: overlay
    fill: wood_light
    opacity: 0.35
    rect: {x: 0, y: 0, width: 1024, height: 1024}
    expression:
      formula: noise(u * 28, v * 28, seed) * 0.5
      mode: alpha
      seed: 3
  - name: header_band
    role: fill
    fill: wood_dark
    rect: {x: 0, y: 0, width: 1024, height: 100}
  - name: header_text
    role: text
    text: Contents and Credits
    fill: cream
    font_size: 44
    align: center
    rect: {x: 20, y: 20, width: 984, height: 60}
  - name: line_1
    role: fill
    fill: ink
    opacity: 0.55
    stamp: rule
    rect: {x: 60, y: 140, width: 900, height: 18}
  - name: line_2
    role: fill
    fill: ink
    opacity: 0.55
    stamp: rule
    rect: {x: 60, y: 176, width: 860, height: 18}
  - name: line_3
    role: fill
    fill: ink
    opacity: 0.55
    stamp: rule
    rect: {x: 60, y: 212, width: 900, height: 18}
  - name: line_4
    role: fill
    fill: ink
    opacity: 0.55
    stamp: rule
    rect: {x: 60, y: 248, width: 780, height: 18}
  - name: line_5
