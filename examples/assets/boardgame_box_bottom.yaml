  - name: barcode_7
    role: overlay
    fill: ink
    rect: {x: 878, y: 940, width: 6, height: 60}
  - name: barcode_8
    role: overlay
    fill: ink
    rect: {x: 890, y: 940, width: 8, height: 60}
  - name: frame_vignette
    role: overlay
    fill: wood_dark
    stamp: vignette
    rect: {x: 0, y: 0, width: 1024, height: 1024}

art_direction:
  subject: board game box bottom panel, credits and lorem-ipsum text
  usage:
    importance: standard_prop
    viewing_distance: close
  detail_density: medium

export:
  kra: true
  png: true
