  - name: line_10
    role: fill
    fill: ink
    opacity: 0.5
    stamp: rule
    rect: {x: 60, y: 746, width: 560, height: 16}
  - name: legal_text
    role: text
    text: Contents may vary. Ages 10 and up. For tabletop use only.
    fill: smoke
    font_size: 22
    align: center
    rect: {x: 40, y: 900, width: 944, height: 40}
  - name: barcode_1
    role: overlay
    fill: ink
    rect: {x: 800, y: 940, width: 6, height: 60}
