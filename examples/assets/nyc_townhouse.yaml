art_direction:
  subject: NYC brownstone townhouse
  style:
    realism: 0.4
    stylization: 0.6
    shape_language: [tall, flat, stoop]
  usage:
    importance: focal_prop
    viewing_distance: medium
  focal_point: stoop over the sunken areaway
  gameplay:
    camera: three_quarter
    must_read: [flat facade, stoop, modest cornice]
  silhouette: >
    Narrow flat slab, modest cornice, stoop over a sunken
    areaway. Not a winged house, not a busy Victorian.
  forms:
    primary: [stacked floors, stoop, cornice]
    secondary: [areaway, door, windows]
    tertiary: [lintels, rails]
  detail_density: medium
  constraints:
  - Look up street photos (Park Slope / Brooklyn stoops).
  references:
  - path: .mason/jobs/nyc_townhouse/refs/Park_Slope_Houses.jpg
    purpose: silhouette
    view: front
geometric_plan:
  primary_read: NYC row-house with high stoop
  recognition: silhouette
  must_survive_small:
  - flat punched facade
  - stoop over the NY areaway
  - modest cornice
  masses:
  - {name: basement, role: primary, connects_to: [parlor]}
  - {name: parlor, role: primary, connects_to: [basement, second]}
  - {name: landing, role: secondary, connects_to: [parlor]}
  silhouette: >
    Side: sidewalk does not meet the facade. Stoop bridges
    that NY gap. Front: even window grid, no bay.
  silhouette_vs_similar: Not Victorian (no bay, no brackets).
  proportions: About 2.2x taller than wide. Parlor is not palatial.
  symmetry: bilateral
  negative_space: areaway under the stoop
  abstraction: named floors, stacked stoop treads with cheeks
  stage: secondary
  landmarks:
  - {id: cornice, role: modest crown, part: cornice}
  - {id: stoop, role: stair mass, part: landing}
  - {id: areaway, role: NY gap, part: sidewalk}
  critical_views:
  - {view: three_quarter, weight: 2}
  - {view: front, weight: 2}
  - {view: side, weight: 2}
  notes:
  - Face -Y. Do not snap sidewalk to basement.
construction_plan:
  techniques:
  - {kind: box, purpose: floors and stair mass, applies_to: mass}
  - {kind: modular, purpose: cornice, applies_to: crown}
  primary_forms:
  - {type: box, purpose: stacked stories}
  secondary_forms:
  - {type: box, purpose: stacked stoop treads}
  - {type: cutout, purpose: windows}
  - {type: cornice, purpose: light crown}
  notes:
  - Stoop is stacked treads, not one notched block.
decomposition:
  mode: parts
  source_views: [front, side, three_quarter]
  components:
  - {id: basement, role: primary, technique: box}
  - {id: parlor, role: primary, technique: box}
  - {id: stoop, role: secondary, technique: box}
  - {id: cornice, role: secondary, technique: modular}
  - {id: window, role: tertiary, technique: box, instance_of: window}
  joints:
  - {child: basement}
  - {child: parlor, parent: basement}
  - {child: stoop, parent: parlor}
  - {child: cornice, parent: parlor}
  - {child: window, parent: parlor}
