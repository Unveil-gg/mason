type: static_prop
id: button_down_shirt
name: Button-Down Shirt

# Long-sleeve button-down fitted to ScrapPaws mousey. Same body
# as fitted_shirt, different cut: longer sleeves, regular ease,
# longer hem, collar + placket + buttons.
dimensions:
  width: 0.09
  depth: 0.04
  height: 0.06

style: default

depends_on:
  - cotton_weave

geometry:
  bevel: false
  garment:
    mode: fit
    kind: shirt
    body:
      path: examples/refs/mousey.glb
    archetype: small_animal
    fit: regular
    body_regions: [torso, upper_arms]
    anchors: [neck, shoulder_left, shoulder_right, waist]
    panels: [front, back, sleeve_left, sleeve_right]
    openings: [neck, waist, wrist_left, wrist_right]
    details: [collar, cuffs, hem, buttons]
    surface_details: [placket]
    fabric_weight: medium
    clearance: 0.014
    thickness: 0.003
    hem: 0.20
    sleeve: long
    neck: 0.11
    tail_opening: true
    hide_covered: true
    stylization: 0.5
    stiffness: 0.55
    wrinkle: 0.2
    cloth_frames: 0
    pose_tests: true

materials:
  strategy: palette
  primary: cotton
  roughness: 0.85
  metallic: 0.0
  shader: fabric
  bump_strength: 0.08
  bump_map:
    asset: cotton_weave
    file: output/asset.png
  palette_overrides:
    cotton: "#F4F1EA"

art_direction:
  subject: Long-sleeve white button-down on mousey
  style:
    realism: 0.2
    stylization: 0.8
    shape_language: [soft, clean, wearable]
  usage:
    importance: standard_prop
    viewing_distance: medium
  silhouette: >
    Shirt covers the body sphere. Long sleeves to the wrists.
    Collar at the head-body pinch. Hem toward the legs.
  forms:
    primary: [torso surface, long sleeves]
    secondary: [collar, hem, cuffs]
    tertiary: [placket, buttons]
  materials:
    - {family: fabric, palette: cotton}
  detail_density: medium
  constraints:
    - No logos. No character body in the exported mesh.
    - Native mousey scale.

geometric_plan:
  primary_read: long-sleeve button-down on mousey
  recognition: mixed
  must_survive_small:
    - neck opening
    - long sleeves
    - hem above the ground
  masses:
    - {name: shirt, role: primary}
  silhouette: >
    Front: collar, placket, sleeves to the wrists.
    Side: rounded chest ease. Hem above the feet.
  silhouette_vs_similar: Not a vest. Not a crate. Not short sleeves.
  proportions: Derived from mousey
  symmetry: bilateral
  negative_space: neck hole, cuffs, hem
  abstraction: body-surface extract
  stage: secondary
  landmarks:
    - {id: neck, role: neck opening, part: shirt}
    - {id: hem, role: shirt hem, part: shirt}
    - {id: cuff_l, role: left cuff, part: shirt}
    - {id: cuff_r, role: right cuff, part: shirt}
  critical_views:
    - {view: worn, weight: 4}
    - {view: front, weight: 2}
    - {view: three_quarter, weight: 2}

construction_plan:
  techniques:
    - {kind: fit, purpose: extract offset silhouette, applies_to: shirt}
  notes:
    - Long sleeves. Regular ease. Extract, do not box.

decomposition:
  mode: parts
  source_views: [worn, front]
  components:
    - {id: torso, role: primary, technique: fit}
    - {id: sleeve, role: primary, technique: fit, instance_of: sleeve}
    - {id: collar, role: secondary, technique: fit}
  joints:
    - {child: torso}
    - {child: sleeve, parent: torso}
    - {child: collar, parent: torso}

export:
  format: glb
  save_blend: true
