type: static_prop
id: fitted_shirt
name: Fitted Shirt

# Button-down extracted from mousey.glb, not a box tube.
dimensions:
  width: 0.083
  depth: 0.033
  height: 0.050

style: default

depends_on:
  - cotton_weave

geometry:
  bevel: false
  garment:
    mode: fit
    kind: shirt
    body: {path: examples/refs/mousey.glb}
    fit: regular
    body_regions: [torso, upper_arms]
    anchors: [neck, shoulder_left, shoulder_right, waist]
    panels: [front, back, sleeve_left, sleeve_right]
    openings: [neck, waist, wrist_left, wrist_right]
    details: [collar, cuffs, hem, placket, buttons]
    fabric_weight: medium
    clearance: 0.010
    thickness: 0.003
    hem: 0.22
    sleeve: short
    neck: 0.12
    tail_opening: true
    hide_covered: true
    stylization: 0.5
    stiffness: 0.65
    wrinkle: 0.15
    cloth_frames: 0
    pose_tests: true

materials:
  strategy: palette
  primary: cotton
  roughness: 0.85
  metallic: 0.0
  shader: fabric
  bump_strength: 0.12
  bump_map:
    asset: cotton_weave
    file: output/asset.png
  palette_overrides:
    cotton: "#F4F1EA"

art_direction:
  subject: >
    Short-sleeve button-down fitted to ScrapPaws mousey.
    Separate wearable shirt. No body in the GLB.
  style:
    realism: 0.25
    stylization: 0.75
    shape_language: [soft, clean, wearable]
  usage:
    importance: standard_prop
    viewing_distance: medium
  silhouette: >
    Shirt extracted from the mouse torso and upper arms.
    Collar, placket, short sleeves, hem above the feet.
  forms:
    primary: [torso surface, short sleeves]
    secondary: [collar, placket, cuffs, hem]
    tertiary: [buttons]
  materials:
    - {family: fabric, palette: cotton}
  detail_density: low
  constraints:
    - No logos. No character body in the exported mesh.
    - Native mousey scale. Same skeleton if rigged.

geometric_plan:
  primary_read: button-down extracted from mousey
  recognition: mixed
  must_survive_small:
    - collar and neck opening
    - short sleeves
    - hem above the ground
    - placket
  masses:
    - {name: shirt, role: primary, connects_to: []}
  silhouette: >
    Front: collar, placket, sleeve stubs.
    Side: chest ease, open cuff. Hem near scaled Z 0.22.
  silhouette_vs_similar: Not a vest. Not a potato or crate.
  proportions: Derived from mousey, not a human mannequin.
  symmetry: bilateral
  negative_space: neck hole, cuffs, hem
  abstraction: body-surface extract, ease offset, solidify
  stage: secondary
  landmarks:
    - {id: neck, role: neck opening, part: shirt}
    - {id: hem, role: shirt hem, part: shirt}
    - {id: cuff_l, role: left cuff, part: shirt}
    - {id: cuff_r, role: right cuff, part: shirt}
  critical_views:
    - {view: front, weight: 3}
    - {view: side, weight: 2}
    - {view: three_quarter, weight: 2}
  notes:
    - Extract faces, do not loft a blob. Body is not exported.

construction_plan:
  techniques:
    - {kind: fit, purpose: extract offset silhouette, applies_to: shirt}
  primary_forms:
    - {type: extract, purpose: torso and upper-arm faces}
  secondary_forms:
    - {type: collar, purpose: neck ring}
    - {type: placket, purpose: front buttons}
  tertiary_details:
    - {type: cylinder, purpose: buttons, count: 3}
  materials: [fabric]
  keep_parts: []
  rebuild_parts: []
  notes:
    - Artist workflow. Solidify last. Weights from mousey.

export:
  format: glb
  save_blend: true
