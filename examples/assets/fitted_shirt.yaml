type: static_prop
id: fitted_shirt
name: Fitted Shirt

# Cartoon shirt extracted from mousey.glb, not a box tube.
dimensions:
  width: 0.083
  depth: 0.033
  height: 0.050

style: default

geometry:
  bevel: false
  garment:
    mode: fit
    kind: shirt
    body: {path: examples/refs/mousey.glb}
    fit: regular
    body_regions: [torso, upper_arms]
    anchors: [neck, shoulder_left, shoulder_right, waist]
    panels: [front, back, sleeve_left, sleeve_right]
    openings: [neck, waist, wrist_left, wrist_right]
    details: [collar, cuffs, hem]
    surface_details: [placket, buttons]
    fabric_weight: medium
    clearance: 0.010
    thickness: 0.003
    hem: 0.22
    sleeve: short
    neck: 0.12
    tail_opening: true
    hide_covered: true
    stylization: 0.75
    stiffness: 0.65
    wrinkle: 0.15
    cloth_frames: 0
    pose_tests: true

materials:
  strategy: palette
  primary: cotton
  roughness: 0.85
  metallic: 0.0
  shader: fabric
  bump_strength: 0.04
  palette_overrides:
    cotton: "#C4A574"

art_direction:
  subject: >
    Simple cartoon short-sleeve shirt on ScrapPaws mousey.
    Soft extract, not a button-down with tiny cues.
  style:
    realism: 0.15
    stylization: 0.85
    shape_language: [soft, clean, wearable]
  usage:
    importance: standard_prop
    viewing_distance: medium
  silhouette: >
    Soft T-pose shirt on the mouse torso and short sleeves.
    Clean hem and neck opening. No floating trim.
  forms:
    primary: [torso surface, short sleeves]
    secondary: [collar rim, hem, cuffs]
    tertiary: []
  materials:
    - {family: fabric, palette: cotton}
  detail_density: low
  constraints:
    - No logos. No character body in the exported mesh.
    - Native mousey scale. Same skeleton if rigged.

geometric_plan:
  primary_read: simple cartoon shirt on mousey
  recognition: mixed
  must_survive_small:
    - neck opening
    - short sleeves
    - hem above the ground
  masses:
    - {name: shirt, role: primary, connects_to: []}
  silhouette: >
    Front: soft T-pose sleeves and a neck hole.
    Side: rounded chest ease. Hem above the feet.
  silhouette_vs_similar: Not a vest. Not a potato or crate.
  proportions: Derived from mousey, not a human mannequin.
  symmetry: bilateral
  negative_space: neck hole, cuffs, hem
  abstraction: body-surface extract, ease offset, solidify
  stage: secondary
  landmarks:
    - {id: neck, role: neck opening, part: shirt}
    - {id: hem, role: shirt hem, part: shirt}
    - {id: cuff_l, role: left cuff, part: shirt}
    - {id: cuff_r, role: right cuff, part: shirt}
  critical_views:
    - {view: worn, weight: 4}
    - {view: front, weight: 2}
    - {view: three_quarter, weight: 2}
  notes:
    - Extract faces, do not loft a blob. Body is not exported.

construction_plan:
  techniques:
    - {kind: fit, purpose: extract offset silhouette, applies_to: shirt}
  primary_forms:
    - {type: extract, purpose: torso and upper-arm faces}
  secondary_forms:
    - {type: collar, purpose: neck rim offset}
  tertiary_details: []
  materials: [fabric]
  keep_parts: []
  rebuild_parts: []
  notes:
    - Artist workflow. Solidify last. Weights from mousey.

export:
  format: glb
  save_blend: true
