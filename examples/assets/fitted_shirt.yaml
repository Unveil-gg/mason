type: static_prop
id: fitted_shirt
name: Fitted Shirt

# Wearable button-down lofted onto mousey.glb. Body is not exported.
dimensions:
  width: 0.044
  depth: 0.024
  height: 0.059

style: default

depends_on:
  - cotton_weave

geometry:
  bevel: false
  garment:
    mode: fit
    kind: shirt
    body: {path: examples/refs/mousey.glb}
    fit: fitted
    clearance: 0.008
    thickness: 0.003
    hem: 0.22
    sleeve: short
    neck: 0.10
    tail_opening: false
    stylization: 0.55
    stiffness: 0.7
    wrinkle: 0.15
    cloth_frames: 0
    pose_tests: true

materials:
  strategy: palette
  primary: cotton
  roughness: 0.85
  metallic: 0.0
  shader: fabric
  bump_strength: 0.12
  bump_map:
    asset: cotton_weave
    file: output/asset.png
  palette_overrides:
    cotton: "#F4F1EA"

art_direction:
  subject: >
    Short-sleeve button-down fitted to the ScrapPaws mousey
    character. Separate wearable shirt, no body in the GLB
  style:
    realism: 0.25
    stylization: 0.75
    shape_language: [soft, clean, wearable]
  usage:
    importance: standard_prop
    viewing_distance: medium
  silhouette: >
    Short-sleeve T-pose shirt on a ~1 m mouse torso. Open neck
    and cuffs, hem above the ground. Follows the body.
  forms:
    primary: [torso loft, short sleeves]
    secondary: [neckline, armholes, hem]
    tertiary: []
  materials:
    - {family: fabric, palette: cotton}
  detail_density: low
  constraints:
    - No logos. No character body in the exported mesh.
    - Origin at the feet. Stay below the face.
    - Shirt is a separate wearable, not welded to the mouse.

geometric_plan:
  primary_read: short-sleeve shirt fitted to mousey
  recognition: mixed
  must_survive_small:
    - floating hem above the ground
    - open neck
    - T-pose short sleeves
    - body-following silhouette
  masses:
    - {name: shirt, role: primary, connects_to: []}
  silhouette: >
    Front: mouse torso follow, neck hole, sleeve stubs.
    Side: chest follow, open cuff. Hem near Z 0.22.
  silhouette_vs_similar: Not a vest. Not a box tube or crate.
  proportions: >
    About 0.42 wide in T-pose. Neck hole 0.10. Hem at Z 0.22.
  symmetry: bilateral
  negative_space: neck hole, open cuffs, hollow torso
  abstraction: lofted body loops, shrinkwrap, light cloth
  stage: secondary
  landmarks:
    - {id: neck, role: neck opening, part: shirt}
    - {id: hem, role: shirt hem, part: shirt}
    - {id: cuff_l, role: left cuff, part: shirt}
    - {id: cuff_r, role: right cuff, part: shirt}
  critical_views:
    - {view: front, weight: 3}
    - {view: side, weight: 2}
    - {view: three_quarter, weight: 2}
  notes:
    - Face -Y. No geometry.bodies. Openings stay open.
    - mousey is _mason_body and is not exported.

construction_plan:
  techniques:
    - {kind: fit, purpose: loft then shrinkwrap, applies_to: shirt}
  primary_forms:
    - {type: loft, purpose: torso rings from mousey slices}
    - {type: loft, purpose: short sleeve tubes}
  secondary_forms:
    - {type: opening, purpose: neckline and cuffs}
  tertiary_details: []
  materials: [fabric]
  keep_parts: []
  rebuild_parts: []
  notes:
    - Generate from body loops. Do not use a box as primary.
    - Solidify last. Export shirt plus weights, not the body.

export:
  format: glb
  save_blend: true
