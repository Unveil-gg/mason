type: static_prop
id: dice_game_box
workflow: prop
name: Travel Pips Box

dimensions:
  width: 0.11
  depth: 0.075
  height: 0.036

style: default

depends_on:
  - dice_game_cover
  - dice_game_spine

geometry:
  bevel: true
  bevel_width: 0.001
  bevel_segments: 2
  parts:
    - name: tray
      shape: box
      size: [0.104, 0.070, 0.026]
      location: [0.0, 0.0, 0.013]
      family: cardboard
      material: wood_light
    - name: lid
      shape: box
      size: [0.110, 0.075, 0.010]
      location: [0.0, 0.0, 0.031]
      family: cardboard
      material: cream

materials:
  primary: cream

decals:
  - name: cover
    image: {asset: dice_game_cover, file: output/asset.png}
    face: top
    inset: 0.0003
    material: cream
  - name: front_spine
    image: {asset: dice_game_spine, file: output/asset.png}
    face: front
    inset: 0.0003
    material: wood_dark
  - name: back_spine
    image: {asset: dice_game_spine, file: output/asset.png}
    face: back
    inset: 0.0003
    material: wood_dark

art_direction:
  subject: closed pocket dice-game carton with printed lid
  style:
    realism: 0.45
    stylization: 0.55
    shape_language: [rectangular, printed, pocket]
  usage:
    importance: hero
    viewing_distance: close
  focal_point: TRAVEL PIPS over painted dice on felt
  value_hierarchy: cream carton, green felt painting, dark spine
  silhouette: shallow landscape box
  gameplay:
    camera: three_quarter
    must_read: [box, lid painting, title]
  recognition_details: [TRAVEL PIPS, three dice, felt]
  forms:
    primary: [tray, lid]
    secondary: [cover, front_spine]
    tertiary: []
  detail_density: medium

geometric_plan:
  primary_read: packaged pocket dice game, not a crate
  recognition: mixed
  must_survive_small:
    - closed lid over tray
    - printed landscape lid
    - titled spine
  masses:
    - {name: tray, role: primary}
    - {name: lid, role: primary, connects_to: [tray]}
  silhouette: shallow landscape brick
  silhouette_vs_similar: Not a book. Not a crate. Art is the lid.
  proportions: Box about 11 by 7.5 by 3.6 cm
  symmetry: bilateral
  negative_space: none
  abstraction: printed carton
  stage: material
  landmarks:
    - {id: lid, role: printed lid, part: lid}
    - {id: front_spine, role: TRAVEL PIPS spine, part: tray}
  critical_views:
    - {view: three_quarter, weight: 3}
    - {view: top, weight: 2}
    - {view: front, weight: 1}

construction_plan:
  techniques:
    - {kind: box, purpose: lid and tray, applies_to: package}
  primary_forms:
    - {type: box, purpose: tray}
    - {type: box, purpose: lid}
  notes:
    - Cover and spine are illustrated jobs, applied as decals.
    - Painted lid is AI underlay plus Mason lettering. No dice recipe.

export:
  format: glb
  save_blend: true
