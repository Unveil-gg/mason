art_direction:
  subject: pocket travel dice game in a small lid-and-tray box
  style:
    realism: 0.35
    stylization: 0.65
    shape_language: [rectangular, printed, pocket]
  usage:
    importance: hero
    viewing_distance: close
  focal_point: lid art and two loose dice on the lid
  value_hierarchy: cream lid, green cover, dark pips
  silhouette: shallow rectangular box with two cubes on top
  gameplay:
    camera: three_quarter
    must_read: [box, lid art, two dice]
  recognition_details: [TRAVEL PIPS, pip cubes]
  forms:
    primary: [tray, lid, die_a, die_b]
    secondary: [top_art]
    tertiary: [pips]
  detail_density: medium

geometric_plan:
  primary_read: packaged pocket dice game, not a crate
  recognition: mixed
  must_survive_small:
    - lid over tray
    - two cubes on the lid
    - pip dots
  masses:
    - {name: tray, role: primary}
    - {name: lid, role: primary, connects_to: [tray]}
    - {name: die_a, role: secondary, connects_to: [lid]}
    - {name: die_b, role: secondary, connects_to: [lid]}
  silhouette: shallow brick with two sitting cubes
  silhouette_vs_similar: Not a book. Not a crate. Dice sit on the lid.
  proportions: Box about 11 by 7.5 cm. Dice 16 mm.
  symmetry: local
  negative_space: air around the two dice
  abstraction: printed product plus primitive cubes
  stage: secondary
  landmarks:
    - {id: lid, role: printed lid, part: lid}
    - {id: die_a, role: left die, part: die_a}
    - {id: die_b, role: right die, part: die_b}
  critical_views:
    - {view: three_quarter, weight: 3}
    - {view: top, weight: 2}
    - {view: front, weight: 1}

construction_plan:
