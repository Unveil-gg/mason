art_direction:
  subject: travel dice-game box lid, three dice on green felt
  style:
    realism: 0.3
    stylization: 0.7
    shape_language: [blocky, printed, pocket]
  usage:
    importance: hero
    viewing_distance: close
  focal_point: TRAVEL PIPS title over three cream dice
  value_hierarchy: dark banner, cream dice, green felt ground
  silhouette: landscape lid, banner on top, three squares
  gameplay:
    camera: top
    must_read: [title, three dice, felt table]
  recognition_details: [five-pip, three-pip, four-pip]
  detail_density: medium

export:
  kra: true
  png: true
