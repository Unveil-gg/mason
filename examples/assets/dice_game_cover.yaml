type: layered_raster
id: dice_game_cover
workflow: illustrated
name: Travel Pips Cover

dimensions:
  width: 768
  height: 512

style: default

layers:
  - name: felt
    role: background
    fill: label_green
  - name: painting
    role: image
    image: examples/ref/travel_pips_cover.png
    rect: {x: 0, y: 0, width: 768, height: 512}
  - name: banner
    role: fill
    fill: wood_dark
    opacity: 0.82
    rect: {x: 0, y: 24, width: 768, height: 118}
  - name: title
    role: text
    text: TRAVEL PIPS
    fill: cream
    font_size: 58
    align: center
    rect: {x: 36, y: 32, width: 696, height: 70}
  - name: subtitle
    role: text
    text: A Pocket Dice Game
    fill: brass
    font_size: 24
    align: center
    rect: {x: 36, y: 100, width: 696, height: 32}
  - name: vignette
    role: overlay
    fill: wood_dark
    stamp: vignette
    opacity: 0.45
    rect: {x: 0, y: 0, width: 768, height: 512}

art_direction:
  subject: travel dice-game box lid, painted product art
  style:
    realism: 0.55
    stylization: 0.45
    shape_language: [printed, pocket, felt]
  usage:
    importance: hero
    viewing_distance: close
  focal_point: TRAVEL PIPS over three ivory dice on green felt
  value_hierarchy: dark banner, cream dice, deep green felt
  silhouette: landscape lid
  gameplay:
    camera: top
    must_read: [title, three dice, felt]
  recognition_details: [pips, felt, title]
  detail_density: high

export:
  kra: true
  png: true
