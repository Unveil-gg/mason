type: static_prop
id: junkyard_block
workflow: prop
name: Trash Cube

# Stackable yard bale for Scrap Paws. A soft cube; the junk
# is painted and bumped, not modeled as sticking-out scraps.
# Sits on z=0. Top face stays flush so cubes can stack.
dimensions:
  width: 0.94
  depth: 0.94
  height: 0.92

style: iron

geometry:
  bevel: true
  bevel_width: 0.016
  bevel_segments: 2
  parts:
    - name: bale
      shape: box
      size: [0.90, 0.90, 0.90]
      location: [0.0, 0.0, 0.45]
      material: iron
      family: rubber
      texture: {path: examples/ref/trash_cube_albedo.png}
      bump_map: {path: examples/ref/trash_cube_bump.png}
      bevel: true
    - name: strap_top_a
      shape: box
      size: [0.90, 0.036, 0.012]
      location: [0.0, -0.16, 0.894]
      material: steel
      family: bare_metal
      bevel: false
    - name: strap_top_b
      shape: box
      size: [0.90, 0.036, 0.012]
      location: [0.0, 0.16, 0.894]
      material: steel
      family: bare_metal
      bevel: false
    - name: strap_cross
      shape: box
      size: [0.036, 0.90, 0.012]
      location: [0.0, 0.0, 0.894]
      material: steel
      family: bare_metal
      bevel: false
    - name: strap_left_a
      shape: box
      size: [0.012, 0.036, 0.82]
      location: [-0.454, -0.16, 0.45]
      material: steel
      family: bare_metal
      bevel: false
    - name: strap_left_b
      shape: box
      size: [0.012, 0.036, 0.82]
      location: [-0.454, 0.16, 0.45]
      material: steel
      family: bare_metal
      bevel: false
    - name: strap_right_a
      shape: box
      size: [0.012, 0.036, 0.82]
      location: [0.454, 0.16, 0.45]
      material: steel
      family: bare_metal
      bevel: false
    - name: strap_right_b
      shape: box
      size: [0.012, 0.036, 0.82]
      location: [0.454, -0.16, 0.45]
      material: steel
      family: bare_metal
      bevel: false
    - name: strap_front
      shape: box
      size: [0.90, 0.012, 0.034]
      location: [0.0, -0.454, 0.45]
      material: steel
      family: bare_metal
      bevel: false
    - name: strap_back
      shape: box
      size: [0.90, 0.012, 0.034]
      location: [0.0, 0.454, 0.45]
      material: steel
      family: bare_metal
      bevel: false

materials:
  primary: iron
  bump_strength: 0.35

art_direction:
  subject: >
    cozy stackable trash cube, soft cardboard and metal
    packed under thin steel bands
  style:
    realism: 0.2
    stylization: 0.8
    shape_language: [cube, soft, strapped]
  usage:
    importance: standard_prop
    viewing_distance: medium
  focal_point: warm painted junk on a stackable cube
  value_hierarchy: tan cardboard, silver scrap, shiny steel bands
  silhouette: nearly a cube, bands barely proud
  gameplay:
    camera: three_quarter
    must_read: [cube, straps, cardboard]
  recognition_details: [bale, thin bands, painted scrap]
  forms:
    primary: [bale]
    secondary: [strap_cross, strap_front]
    tertiary: [strap_top_a]
  detail_density: medium
  asymmetry: painted scraps only, even bands

geometric_plan:
  primary_read: one soft cube of packed junk, stackable
  recognition: mixed
  must_survive_small:
    - cube mass
    - thin steel bands
    - warm cardboard face
  masses:
    - {name: bale, role: primary}
    - {name: straps, role: secondary, connects_to: [bale]}
  silhouette: cube with shallow bands
  silhouette_vs_similar: Not a crate. Not a loose junk pile.
  proportions: 0.9 m cube, sitting on the ground
  symmetry: local
  negative_space: none
  abstraction: cube plus bump; texture carries the junk
  stage: material
  landmarks:
    - {id: bale, role: packed face, part: bale}
    - {id: strap_cross, role: top band, part: strap_cross}
  critical_views:
    - {view: three_quarter, weight: 3}
    - {view: front, weight: 2}
    - {view: top, weight: 2}

construction_plan:
  techniques:
    - {kind: box, purpose: bale and flush straps, applies_to: cube}
  primary_forms:
    - {type: box, purpose: stackable bale}
  secondary_forms:
    - {type: box, purpose: steel straps, count: 4}
  notes:
    - Nothing proud enough to block a stack.
    - Bump map makes the face lumpy. Do not model scraps.

export:
  format: glb
  save_blend: true
  profile: prop
  atlas_size: 1024
  volumes:
    - name: col_bale
      parts: [bale]
