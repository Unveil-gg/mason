type: layered_raster
id: pause_menu_item
name: Pause Menu Item Frame

# One horizontal pause-menu row for a medieval RPG: wood outer frame,
# gold inner rule, parchment field, gem pip, sample label.
dimensions:
  width: 640
  height: 96

style: medieval

layers:
  - name: wood
    role: background
    fill: wood
  - name: gold_outer
    role: fill
    fill: gold_dark
    rect: {x: 8, y: 8, width: 624, height: 80}
  - name: parchment
    role: fill
    fill: parchment
    rect: {x: 14, y: 14, width: 612, height: 68}
  - name: gold_rule_top
    role: fill
    fill: gold
    rect: {x: 20, y: 18, width: 600, height: 3}
  - name: gold_rule_bottom
    role: fill
    fill: gold
    rect: {x: 20, y: 75, width: 600, height: 3}
  - name: corner_tl_h
    role: fill
    fill: gold
    rect: {x: 16, y: 16, width: 18, height: 4}
  - name: corner_tl_v
    role: fill
    fill: gold
    rect: {x: 16, y: 16, width: 4, height: 18}
  - name: corner_tr_h
    role: fill
    fill: gold
    rect: {x: 606, y: 16, width: 18, height: 4}
  - name: corner_tr_v
    role: fill
    fill: gold
    rect: {x: 620, y: 16, width: 4, height: 18}
  - name: corner_bl_h
    role: fill
    fill: gold
    rect: {x: 16, y: 76, width: 18, height: 4}
  - name: corner_bl_v
    role: fill
    fill: gold
    rect: {x: 16, y: 62, width: 4, height: 18}
  - name: corner_br_h
    role: fill
    fill: gold
    rect: {x: 606, y: 76, width: 18, height: 4}
  - name: corner_br_v
    role: fill
    fill: gold
    rect: {x: 620, y: 62, width: 4, height: 18}
  - name: gem_bezel
    role: fill
    fill: gold
    rect: {x: 32, y: 32, width: 30, height: 30}
  - name: gem
    role: fill
    fill: gem
    rect: {x: 36, y: 36, width: 22, height: 22}
  - name: gem_shine
    role: fill
    fill: gold
    rect: {x: 40, y: 40, width: 6, height: 6}
  - name: divider
    role: fill
    fill: gold_dark
    rect: {x: 72, y: 28, width: 3, height: 40}
  - name: label
    role: text
    text: RESUME
    fill: ink
    font_size: 28
    align: left
    font: Times New Roman
    rect: {x: 90, y: 24, width: 420, height: 48}

art_direction:
  subject: medieval RPG pause-menu row
  style:
    realism: 0.2
    stylization: 0.8
    shape_language: [ornamental, framed, parchment]
  usage:
    importance: focal_prop
    viewing_distance: close
  silhouette: long horizontal bar with gem pip on the left
  forms:
    primary: [wood frame, parchment field]
    secondary: [gold rules, gem, divider]
    tertiary: [L-corners, gem bezel, label]
  detail_density: medium

export:
  kra: true
  png: true
