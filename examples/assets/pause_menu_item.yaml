type: layered_raster
id: pause_menu_item
name: Pause Menu Item Frame

# One horizontal pause-menu row for a medieval RPG: wood outer frame,
# gold inner rule, parchment field, gem pip, sample label.
dimensions:
  width: 640
  height: 96

style: medieval

layers:
  - name: wood
    role: background
    fill: wood
  - name: gold_outer
    role: fill
    fill: gold_dark
    rect: {x: 8, y: 8, width: 624, height: 80}
  - name: parchment
    role: fill
    fill: parchment
    rect: {x: 14, y: 14, width: 612, height: 68}
  - name: gold_rule_top
    role: fill
    fill: gold
    stamp: rule
    rect: {x: 20, y: 18, width: 600, height: 3}
  - name: gold_rule_bottom
    role: fill
    fill: gold
    stamp: rule
    rect: {x: 20, y: 75, width: 600, height: 3}
  - name: corner_tl
    role: fill
    fill: gold
    stamp: l_corner
    stamp_corner: tl
    rect: {x: 16, y: 16, width: 18, height: 18}
  - name: corner_tr
    role: fill
    fill: gold
    stamp: l_corner
    stamp_corner: tr
    rect: {x: 606, y: 16, width: 18, height: 18}
  - name: corner_bl
    role: fill
    fill: gold
    stamp: l_corner
    stamp_corner: bl
    rect: {x: 16, y: 62, width: 18, height: 18}
  - name: corner_br
    role: fill
    fill: gold
    stamp: l_corner
    stamp_corner: br
    rect: {x: 606, y: 62, width: 18, height: 18}
  - name: pip
    role: fill
    fill: gold
    stamp: gem
    stamp_inner: gem
    rect: {x: 32, y: 32, width: 30, height: 30}
  - name: divider
    role: fill
    fill: gold_dark
    rect: {x: 72, y: 28, width: 3, height: 40}
  - name: label
    role: text
    text: RESUME
    fill: ink
    font_size: 28
    align: left
    font: Times New Roman
    rect: {x: 90, y: 24, width: 420, height: 48}

art_direction:
  subject: medieval RPG pause-menu row
  style:
    realism: 0.2
    stylization: 0.8
    shape_language: [ornamental, framed, parchment]
  usage:
    importance: focal_prop
    viewing_distance: close
  silhouette: long horizontal bar with gem pip on the left
  forms:
    primary: [wood frame, parchment field]
    secondary: [gold rules, gem, divider]
    tertiary: [L-corners, gem bezel, label]
  detail_density: medium

export:
  kra: true
  png: true
